[env:waveshare_amoled_216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/waveshare_amoled_216.csv
upload_speed = 921600
monitor_speed = 115200

; Single board: compile shared code + this board's folder only.
build_src_filter =
    +<*>
    -<boards/>
    +<boards/waveshare_amoled_216/>

build_flags =
    -DBOARD_AMOLED_216
    ; LVGL's TLSF pool defaults to 64 KB of internal RAM (.bss), which starves
    ; the pull-OTA WiFi/TLS path. Allocate it in PSRAM instead: the builtin core
    ; calls LV_MEM_POOL_ALLOC(LV_MEM_SIZE) when the macro is defined, so force
    ; esp_heap_caps.h in and point it at heap_caps_malloc(..., SPIRAM).
    -DLV_MEM_SIZE=65536
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; AXP2101 PMU
    -DXPOWERS_CHIP_AXP2101
    ; NimBLE config — peripheral, 2 simultaneous connections so the OS can
    ; hold the HID link (Space key from BOOT button) while the daemon holds
    ; its own connection for the custom data service.
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; Peripheral Preferred Connection Parameters (GAP 0x2A04) — the accessory's
    ; steady-state preference per Microsoft's Bluetooth accessory guidelines:
    ; interval 15-30ms (HID-snappy), latency 0, supervision timeout 6s.
    ; Captured on hardware: Windows honors a long timeout (9.6s) while only its
    ; HID driver holds the link, but clamps to 2s whenever an app GATT session
    ; (the daemon) is active — PPCP documents our preference and governs the
    ; HID-only steady state; it does NOT override that 2s clamp. Units:
    ; interval ×1.25ms, timeout ×10ms. Windows caches GATT per bond, so a
    ; re-pair is needed for changes here to be seen.
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MIN_CONN_INTERVAL=12
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MAX_CONN_INTERVAL=24
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SLAVE_LATENCY=0
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SUPERVISION_TMO=600
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1

; Stamp FW_VERSION / FW_GIT_SHA / FW_BUILD_DATE from git at build time
; (design/ota-pull/DESIGN.md section 5.2), then generate the pinned-server
; certificate header from the untracked certs/pinned_server.pem
; (design/ota-pull/DESIGN.md section 8). Both run before compile so the
; src/certs/pinned_server_pem.h include always resolves; absent PEM -> a
; fail-closed placeholder. The sim env excludes ota_pull.cpp and stays free
; of both scripts.
extra_scripts =
    pre:scripts/version.py
    pre:scripts/gen_pinned_cert.py
    pre:scripts/lvgl_psram.py

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.6
    lewisxhe/SensorLib@^0.2.6
    lewisxhe/XPowersLib@^0.2.7
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1


[env:sim]
; Native desktop simulator — an SDL2 window instead of a panel, mouse as
; touch, keyboard as buttons, JSONL scenario playback instead of BLE. See
; boards/sim/board.h for the key map and scenario format.
; Requires SDL2 dev headers (sdl2-config on PATH): apt install libsdl2-dev.
platform = native

build_src_filter =
    +<*>
    -<boards/>
    +<boards/sim/>
    ; transport + audio are hardware-only: boards/sim/ble_sim.cpp stubs
    ; ble.h with scenario playback, and the sim's sound HAL no-ops.
    -<ble.cpp>
    -<ota.cpp>
    -<ota_pull.cpp>
    -<ota_wifi.cpp>
    -<chime.cpp>
    -<es8311.c>

build_flags =
    -DBOARD_SIM
    ; macOS: `g++` is Apple clang, which defaults to C++98 without an explicit
    ; -std and fails on constexpr / brace-init. Linux g++ (real GCC) defaults
    ; to gnu++17, which is why this only bites on macOS.
    -std=gnu++17
    ; behave like the PSRAM-equipped S3 targets (big LVGL strips, full
    ; splash canvas, screenshot path compiled) — the heap shim maps every
    ; capability to plain malloc anyway
    -DBOARD_HAS_PSRAM
    -Isrc/boards/sim/shim
    -lm
    !sdl2-config --cflags --libs
    ; LVGL config — identical to the hardware envs
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1

lib_deps =
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
